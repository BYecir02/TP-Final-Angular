<section class="weather-page" aria-live="polite">
  @if (state$ | async; as state) {
    @switch (state.status) {
      @case ('loading') {
        <p class="status-message">Chargement de la météo...</p>
      }
      @case ('data') {
        <app-weather-card [weather]="state.weather" />
      }
      @case ('error') {
        <p class="status-message status-message--error" role="alert">{{ state.message }}</p>
      }
    }
  }
</section>
